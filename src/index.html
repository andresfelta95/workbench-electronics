<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Workbench — Interactive Electronics</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#EFF1EF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1313" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=VT323&family=JetBrains+Mono&family=Iosevka+Charon+Mono&display=swap"
    />
    <script>
      // Applied before first paint so the chosen theme never flashes.
      (function () {
        try {
          var t = localStorage.getItem('wb-theme');
          if (t === 'dark' || t === 'light') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
