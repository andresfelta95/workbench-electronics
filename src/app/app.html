<a class="skip-link" href="#main">{{ t().nav.skipToContent }}</a>

<header class="masthead">
  <div class="page masthead__inner">
    <a class="brand" [routerLink]="['/', lang()]">
      <svg class="brand__mark" viewBox="0 0 40 20" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M1 10h7" />
          <rect x="8" y="5" width="24" height="10" rx="1" />
          <path d="M32 10h7" />
        </g>
      </svg>
      <span class="brand__text">
        <span class="brand__name">{{ t().siteName }}</span>
        <span class="brand__tagline">{{ t().tagline }}</span>
      </span>
    </a>

    <nav class="masthead__nav" [attr.aria-label]="t().nav.menu">
      <a [routerLink]="['/', lang()]" fragment="path">{{ t().nav.curriculum }}</a>
      <a class="lang" [routerLink]="switchTarget()" [attr.hreflang]="other()" [attr.lang]="other()">
        {{ t().langSwitch.other }}
      </a>
      <button type="button" class="theme" (click)="theme.toggle()" [attr.aria-label]="t().theme.toggle">
        @if (theme.resolved() === 'dark') {
          <svg viewBox="0 0 20 20" aria-hidden="true" width="16" height="16">
            <circle cx="10" cy="10" r="4" fill="currentColor" />
            <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <path d="M10 1v2M10 17v2M1 10h2M17 10h2M3.6 3.6l1.4 1.4M15 15l1.4 1.4M16.4 3.6L15 5M5 15l-1.4 1.4" />
            </g>
          </svg>
        } @else {
          <svg viewBox="0 0 20 20" aria-hidden="true" width="16" height="16">
            <path
              d="M16 12.3A7 7 0 0 1 7.7 4a7 7 0 1 0 8.3 8.3Z"
              fill="currentColor"
            />
          </svg>
        }
      </button>
    </nav>
  </div>
</header>

<main id="main" tabindex="-1">
  <router-outlet />
</main>

<footer class="footer">
  <div class="page footer__inner">
    <p class="footer__free">{{ t().footer.free }}</p>
    <p class="footer__links">
      <a href="https://github.com/andresfelta95/workbench-electronics" rel="noopener">
        {{ t().footer.source }}
      </a>
      <span aria-hidden="true">·</span>
      <a href="https://creativecommons.org/licenses/by-sa/4.0/" rel="noopener license">
        {{ t().footer.license }}
      </a>
    </p>
    <p class="footer__meta">{{ t().siteName }} · {{ year }} · {{ t().footer.built }}</p>
  </div>
</footer>
