server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's add_header does not merge with a parent block: any location that
    # sets one header must restate all of them, or it silently drops the rest.
    # These three are repeated in every location below for that reason.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The whole site is prerendered, so every route is a real file on disk.
    # Note: no bare `$uri/` — that makes nginx issue a trailing-slash redirect
    # for every route, which turns each canonical URL into an extra hop.
    location / {
        try_files $uri $uri/index.html =404;

        # HTML must be revalidated. A returning visitor holding a cached page
        # would otherwise ask for content-hashed bundles that no longer exist
        # after a deploy, and get a blank page. The request URI here is `/en`,
        # not `/en/index.html`, so this cannot be matched on a .html suffix.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Content-hashed bundles never change under the same name.
    location ~* \.(?:js|css|woff2|svg|png|jpg|webp|ico)$ {
        try_files $uri =404;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Unknown URLs get a real 404 status, with the app shell as the body so the
    # router renders the site's own "open circuit" page rather than nginx's.
    error_page 404 /index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /robots.txt {
        add_header Content-Type text/plain;
        add_header X-Content-Type-Options "nosniff" always;
        return 200 "User-agent: *\nAllow: /\nSitemap: https://electronics.paisbru.com/sitemap.xml\n";
    }
}
