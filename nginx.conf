server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The whole site is prerendered, so every route is a real file on disk.
    # The final fallback only catches genuinely unknown URLs, which the app
    # renders as its own 404 page.
    # Note: no bare `$uri/` — that makes nginx issue a trailing-slash redirect
    # for every route, which turns each canonical URL into an extra hop.
    location / {
        try_files $uri $uri/index.html =404;
    }

    # Unknown URLs get a real 404 status, with the app shell as the body so the
    # router renders the site's own "open circuit" page rather than nginx's.
    error_page 404 /index.html;

    # Content-hashed bundles never change under the same name.
    location ~* \.(?:js|css|woff2|svg|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML must be revalidated or a deploy never reaches anyone.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nAllow: /\nSitemap: https://electronics.paisbru.com/sitemap.xml\n";
    }
}
