energizer-ir-bulletin:
  section: "note"
  authors: "Energizer"
  title: "Battery Internal Resistance"
  container: "Technical Bulletin"
  edition: "Version 2.0"
  year: "August 2026"
  url: "https://data.energizer.com/wp-content/uploads/2026/10/Internal-Resistance-Bulletin.pdf"
  comment: "Checked 2026-10-30; linked from data.energizer.com/general-info. Version 1.1.0 (December 2005) is still served at data.energizer.com/pdfs/batteryir.pdf with the same text, plus \"depending on size\" after the 150 to 300 milliohm range. Fig. 2 is a curve, read to about ±0.03 Ω; its y-axis top label is printed \"10\" where 1.0 is meant. The fig. 2 reading at 20 °C (about 0.13 Ω) is below the 150–300 mΩ stated on p. 1: the curve and the text need not use the same test."
  modules:
    - "00-07 (internal resistance is electronic plus ionic resistance, the \"total effective resistance\"; a 1000 Hz impedance test may not capture all of the ionic part, so it typically reads lower; dual-pulse method: total effective resistance = change in voltage ÷ change in current, example 5 mA then a 505 mA pulse, 1.485 V to 1.378 V, 0.107 V / 500 mA = 0.214 Ω; fresh Energizer alkaline cylindrical cells about 150 to 300 mΩ with a 5 mA drain and a 505 mA 100 ms pulse; p. 1 and fig. 1)"
    - "00-07 (expected loaded voltage = open-circuit voltage − total effective resistance × current, example 1.6 V − 1.0 A × 0.1 Ω = 1.5 V; internal resistance rises during discharge and as temperature drops; \"internal resistance can be calculated based on the voltage drop of the battery under a known load\" and should be taken as a general guideline, not a precise value; p. 2)"
    - "00-07 (fresh E91 AA total effective resistance vs temperature, fig. 2 p. 2, read from the curve, typical: about 0.9 Ω at -40 °C, 0.4 Ω at -20 °C, 0.22 Ω at 0 °C, 0.13 Ω at 20 °C, 0.1 Ω at 40 °C)"

energizer-alkaline-handbook:
  section: "note"
  authors: "Energizer Brands, LLC"
  title: "Alkaline Manganese Dioxide Handbook and Application Manual"
  titleStyle: "italic"
  year: "2018"
  url: "https://data.energizer.com/pdfs/alkaline_appman.pdf"
  comment: "Checked 2026-10-30; linked from data.energizer.com/battery-handbook-crosssections. Footers read \"©2018 Energizer Brands, LLC\" and \"Page n of 14\" (the file has a 15th page, shipping). Fig. 10 is a curve, read to about ±0.03 Ω."
  modules:
    - "00-07 (devices are designed for a range such as 1.6 V to 0.9 V per cell, p. 3; cold raises internal resistance and high drains in the cold cause a large voltage drop, p. 4; abusive conditions such as charging or electrically shorting can produce high levels of hydrogen, p. 4; fresh alkaline cylindrical cells about 150 to 300 mΩ with a 5 mA drain and a 505 mA 100 ms pulse, p. 8; AA/LR6 discharged at 50 mA with 10 mA / 500 mA 1 s pulses at 21 °C: about 0.13 Ω fresh, about 0.2 Ω at mid-life and about 0.65 Ω at the end (about 54 h, 0.8 V), fig. 10 p. 9, read from the curve, typical; a fresh cell tests at about 1.5 V on a load of about 10 Ω for 1–2 s, p. 13)"
    - "00-07 safety callout (\"Don't carry loose batteries in a pocket or purse with metal objects like coins, paper clips, etc. This could potentially short-circuit the battery, generating high heat.\" and \"Short circuits may cause battery leakage which may result in bodily injury.\", p. 14)"

energizer-lithium-coin-manual:
  section: "note"
  authors: "Energizer"
  title: "Primary Lithium Coin Handbook and Application Manual"
  titleStyle: "italic"
  year: "2026"
  url: "https://data.energizer.com/wp-content/uploads/2026/05/Lithium-Coin-app-manual-0526.pdf"
  comment: "Checked 2026-10-30; linked from data.energizer.com/battery-handbook-crosssections. Undated; the file name says 05/26 and it was uploaded in May 2026. Six pages, no printed page numbers (counted from the first page). The IR-vs-capacity curve is read to about ±3 Ω."
  modules:
    - "00-07 (CR2032 internal resistance: \"the starting IR of a 2032 battery is near 10 ohms. the starting IR of AA alkaline batteries is near 0.25 ohms\"; dual-pulse example on a fresh 2032 with a 1 MΩ background drain and a 25 Ω 50 ms pulse: (3.279 V − 2.429 V) ÷ (0.097 A − 0.000003 A) = 9 Ω; IR rises during discharge: with a 75 Ω (about 30 mA) pulse, about 10 Ω fresh, about 15 Ω at 100 mAh, about 36 Ω at 200 mAh, about 65 Ω at the end near 210 mAh, read from the curve, typical; p. 4)"
    - "00-07 (nominal 3 V, Li/MnO2, p. 1; cold temporarily raises the internal resistance and the effect reverses when the cell warms up, p. 3; swallowing a coin cell is a serious hazard, p. 6)"

energizer-nimh-handbook:
  section: "note"
  authors: "Energizer"
  title: "Nickel Metal Hydride (NiMH) Handbook and Application Manual"
  titleStyle: "italic"
  edition: "Version NiMH02.01"
  year: "2010"
  url: "https://data.energizer.com/wp-content/uploads/2020/11/nimhhandbook_ver2-2.pdf"
  comment: "Checked 2026-10-30; linked from data.energizer.com/battery-handbook-crosssections. Footers read \"©2010 Energizer\" and \"Page n of 15\"."
  modules:
    - "00-07 (\"The IR of fresh, fully charged NiMH batteries is typically less than 50 milliohms\"; it stays relatively constant during discharge until near the end, where it rises sharply, and it rises with age and cycling; at the 0.2C rate the voltage drops quickly from an open-circuit voltage of about 1.4 V to the 1.2 V plateau; p. 6)"
    - "00-07 safety callout (\"Nickel metal hydride batteries can generate high currents if shorted. These currents are sufficient to cause burns or ignition of flammable materials.\", p. 14)"

