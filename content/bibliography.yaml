  year: "10 June 2010"
  url: "https://www.sigcon.com/Pubs/edn/SevenPercent.htm"
  comment: "Checked 2026-11-04 on the author's own site (Signal Consulting), which reprints the EDN column. An anecdote, not a measurement report: no values or histogram are given, the parts are 10 % carbon-composition resistors from 1983, and the explanation of a gap is the author's mentor's, drawn on a napkin. Cite it only as the origin of the folk claim, never as evidence about modern 5 % film resistors. See BIBLIOGRAPHY.md §8 (binned distribution)."
  modules:
    - "01-01 (the folk claim, as an anecdote: in 1983 the author checked 300 resistors rated 10 % (carbon composition) and found none within ±1 % of nominal; with a flat spread the chance of that is 0.9^300 = 1.8 × 10^-14; his mentor's explanation was that the maker tested every part, discarded those outside ±10 % and \"pulled out all the good parts and sold them at a higher price with a ±5% tolerance\", leaving a gap in the middle)"

