# Course bibliography: the single source of every reference a lesson can cite.
#
# Each top-level key is a reference id (kebab-case). Lessons cite these ids in
# their `references:` front matter. Entries were transcribed from the tables in
# docs/BIBLIOGRAPHY.md §1–§6; that document records how and when each entry was
# verified, and lists unverified or excluded candidates (§8) that must not be
# added here until checked.
#
# Fields (all values are double-quoted strings, or lists of strings):
#   section     required  textbook (§1) | note (§2) | standard (§3) |
#                         datasheet (§4) | web (§5) | es (§6)
#   title       required  the document's own title only, without surrounding
#                         italics or quotes
#   titleStyle  optional  "italic" | "quoted": overrides the section default
#                         (used for whole works listed under note/web)
#   authors     optional  copied as written ("Surname, I.; Surname, I.")
#   container   optional  journal, series, report/tutorial number, volume
#   edition     optional
#   publisher   optional
#   year        optional  date text as written, qualifiers included
#   identifier  optional  ISBN / DOI / document number (several in one string)
#   url         optional
#   lang        optional  "es" for Spanish-language entries; omitted = English
#   es          optional  on an English entry: id of its Spanish alternate
#   modules     optional  modules or lesson ids (with the figure supported)
#   comment     optional  editorial / verification remark; never rendered

