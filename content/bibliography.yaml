    - "00-07 (Vol. I ch. 10 \"DC Network Analysis\", section \"Thevenin's Theorem\": any linear circuit can be simplified to a single voltage source and series resistance connected to a load, and the theorem is especially useful when the load resistance changes; section \"Maximum Power Transfer Theorem\": \"the maximum amount of power will be dissipated by a load resistance when that load resistance is equal to the Thevenin/Norton resistance of the network supplying the power\", and maximum power transfer does not coincide with maximum efficiency; checked 2026-10-30 on the author's original copy at ibiblio.org/kuphaldt/electricCircuits/DC/DC_10.html because allaboutcircuits.com and web.archive.org returned 403)"

