tt-tn004:
  section: "note"
  authors: "TT Electronics"
  title: "Methods for Marking Values on Resistors"
  container: "Technical Note TN004"
  year: "09.24"
  url: "https://www.ttelectronics.com/TTElectronics/media/ProductFiles/Application-Note/TN004-Methods-for-Marking-Values-on-Resistors.pdf"
  comment: "Checked 2026-11-04. A resistor maker's note (BI Technologies, IRC, Welwyn brands); \"09.24\" is the footer date code. Used for the full colour and letter code because IEC 60062 is paywalled and neither Yageo datasheet lists ±10 % or K."
  modules:
    - "01-01 (colour code for band-marked resistors, \"reference IEC60062\": tolerance silver 10 % K, gold 5 % J, brown 1 % F, red 2 % G, green 0.5 % D, blue 0.25 % C, violet 0.1 % B, grey 0.05 % A, no band 20 % M; multipliers silver × 0.01, gold × 0.1, black × 1 to white × 1G; the tolerance band is wider than, or further from, the other bands; 5-band example 4-7-0-×100-1 % = 47K 1 %, 4-band example 8-2-×1K-5 % = 82K 5 %; p. 1; on chip resistors \"Tolerance is not marked\", E96 values on 0603 use the EIA-96 two-digit-plus-letter code, p. 2)"

ti-snva112:
  section: "note"
  authors: "Texas Instruments"
  title: "AN-1378 Method for Calculating Output Voltage Tolerances in Adjustable Regulators"
  container: "Application Report SNVA112A"
  year: "July 2005, revised May 2013"
  url: "https://www.ti.com/lit/pdf/snva112"
  comment: "Checked 2026-11-04. No author is printed. Fig. 6 is a histogram with no sample size, maker or nominal value stated; the nominal of about 133 Ω and the spread are read from the plot. Table 1 prints 2.64 % for Vout = 3.3 V, ΔVref ±5.0 %, 0.5 % resistors, which repeats the ±2.0 % row and looks like a misprint. Gives worst case and a Taylor-series statistical method; it has no Monte Carlo (see `knudtsen-2022`)."
  modules:
    - "01-01 (divider tolerance stack-up: worst case takes all tolerances \"simultaneously at their worst case extremes\" and gives \"excessively conservative\" limits, §1 and §3 p. 2; worst-case error of Vout = Vref × (R1 + R2)/R1 with Vref = 1.275 V, e.g. Vout 5.0 V, ΔVref ±1 %: ±2.54 % with 1 % resistors and ±9.02 % with 5 % resistors, Table 1 p. 3; the resistor sensitivity runs from 0 to 1 and is highest at high Vout, §4 and Fig. 4 pp. 3–4; R1, R2 and Vref are independent random variables, and even parts from one reel tend to cancel because the two sensitivities have equal magnitude and opposite sign, §5 p. 4; the note assumes resistors are made \"under a 'six sigma' paradigm and have Gaussian variation\" (an assumption, not a vendor statement: \"the vendor may be reluctant to release this data\"), §6 p. 4)"
    - "01-01 (measured distribution: Fig. 6 \"Typical Resistor Variation: 1% General Purpose 0805 SMD\", a single-peaked histogram with its peak near 133 Ω, most bars between about 132.5 and 133.5 Ω and every bar between about 132 and 134 Ω (within about ±0.8 %), inside the dotted ±1 % lines, no gap at the centre, read from the plot to about ±0.2 Ω; the text says the 1 % resistor is \"controlled to greater than ±6σ and is also approximately Gaussian\", p. 5)"
    - "01-01 (statistical result: \"RSS (root sum squares) method is only valid for the case when independent Gaussian random variables are combined as sums\", §7 p. 6; with tolerances taken as ±6σ the equivalent output tolerance for Vout 5.0 V, ΔVref ±1 % is ±1.45 % with 1 % resistors and ±5.36 % with 5 % resistors, against ±2.54 % and ±9.02 % worst case, Table 4 p. 8)"

knudtsen-2022:
  section: "note"
  authors: "Knudtsen, S. (Analog Devices)"
  title: "How to Model Statistical Tolerance Analysis for Complex Circuits Using LTspice"
  container: "Electronic Design"
  year: "1 Feb. 2022"
  url: "https://www.electronicdesign.com/technologies/test-measurement/article/21215610/analog-devices-how-to-model-statistical-tolerance-analysis-for-complex-circuits-using-ltspice"
  comment: "Checked 2026-11-04 on the Electronic Design copy. Analog Devices also hosts the article at analog.com/en/resources/technical-articles/how-to-model-statistical-tolerance-analysis.html, but analog.com timed out or refused scripted requests on 2026-11-04, so that copy was not seen. The article makes no claim about how real resistor values are distributed."
  modules:
    - "01-01 (Monte Carlo vs worst case: \"WCA requires determining which parameters must be maximized or minimized for a true worst-case result\"; \"WCA results often violate design specification requirements, leading to expensive component selection\"; \"WCA results statistically don't represent commonly observed results\"; a statistical analysis gives \"a distribution that reflects what should be commonly measured in physical systems\"; \"both worst-case and statistical analysis provide valuable insights\"; \"worst-case limits are statistically improbable\"; LTspice {mc(1, tol)} gives a resistor \"nominally 1 with a Monte Carlo distribution defined by the parameter tol\", Appendix D; Gaussian runs with sigma = 1/3 and 1/5 of a 1 % tolerance, Appendix B; trimmed IC references are \"Gaussian before being trimmed and Monte Carlo after trimming\", and units that cannot be trimmed are discarded, Appendix A)"

